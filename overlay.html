<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay</title>
    <style>
        @font-face {
            font-family: 'DMSans';
            src: url('/fonts/DMSans.ttf') format('truetype');
            font-weight: 100 900;
            font-style: normal;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent !important;
        }
        .zone {
            position: absolute;
            pointer-events: none;
            border: 2px solid;
        }
        .zone-edge {
            background: rgba(0, 200, 255, 0.3);
            border-color: rgba(0, 200, 255, 0.8);
        }
        .zone-corner {
            background: rgba(255, 80, 80, 0.4);
            border-color: rgba(255, 80, 80, 0.9);
        }
        .zone-disabled {
            background: rgba(128, 128, 128, 0.15);
            border-color: rgba(128, 128, 128, 0.5);
            border-style: dashed;
        }
        .zone-monitor {
            background: transparent;
            border-color: rgba(255, 255, 255, 0.28);
            border-style: solid;
        }
        .sequence-dot {
            position: absolute;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: rgba(0, 255, 128, 0.85);
            border: 2px solid rgba(0, 0, 0, 0.7);
            color: #000;
            font-size: 10px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translate(-50%, -50%);
            pointer-events: none;
            user-select: none;
            box-shadow: 0 0 6px rgba(0, 255, 128, 0.6);
        }
        .sequence-dot.active {
            background: rgba(255, 230, 0, 0.95);
            box-shadow: 0 0 10px rgba(255, 230, 0, 0.9);
        }
        .sequence-pick-hint {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
            font-family: sans-serif;
            font-size: 14px;
            pointer-events: none;
            z-index: 999999;
        }
        #overlay-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        @keyframes fadeOut {
            0% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; }
        }
        .fade-out {
            animation: fadeOut 5s ease forwards;
        }
    </style>
</head>
<body>
    <div id="overlay-container"></div>

    <script>
        const container = document.getElementById('overlay-container');
        let pickMode = false;
        let overlayBounds = { x: 0, y: 0, width: window.screen.width, height: window.screen.height };

        function setupTauriListener() {
            if (!window.__TAURI__ || !window.__TAURI__.event) {
                console.log('[Overlay] Tauri not ready, retrying...');
                setTimeout(setupTauriListener, 200);
                return;
            }

            window.__TAURI__.event.listen('zone-data', (event) => {
                pickMode = false;
                renderZones(event.payload);
            });

            window.__TAURI__.event.listen('sequence-pick-data', (event) => {
                pickMode = true;
                renderSequencePick(event.payload);
            });

            window.__TAURI__.event.listen('sequence-points', (event) => {
                renderSequencePoints(event.payload);
            });

            window.__TAURI__.event.listen('clear-zones', () => {
                container.innerHTML = '';
                container.classList.remove('fade-out');
                pickMode = false;
            });

            document.addEventListener('click', handleOverlayClick);
            document.addEventListener('contextmenu', handleOverlayContextMenu);

            console.log('[Overlay] Event listeners registered');
        }

        function renderSequencePick(data) {
            container.innerHTML = '';
            container.classList.remove('fade-out');

            if (data && data.bounds) {
                overlayBounds = data.bounds;
            }

            const hint = document.createElement('div');
            hint.className = 'sequence-pick-hint';
            hint.textContent = 'Click anywhere to add a sequence point. Right-click to finish.';
            container.appendChild(hint);

            renderSequencePoints(data);
        }

        function renderSequencePoints(data) {
            container.querySelectorAll('.sequence-dot, .sequence-pick-hint').forEach(el => el.remove());

            if (!data || !Array.isArray(data.points)) return;

            if (pickMode) {
                const hint = document.createElement('div');
                hint.className = 'sequence-pick-hint';
                hint.textContent = 'Click anywhere to add a sequence point. Right-click to finish.';
                container.appendChild(hint);
            }

            data.points.forEach((point, index) => {
                const dot = document.createElement('div');
                dot.className = 'sequence-dot' + (data.activeIndex === index ? ' active' : '');
                dot.textContent = index + 1;
                dot.style.left = point.x + 'px';
                dot.style.top = point.y + 'px';
                container.appendChild(dot);
            });
        }

        function renderZones(data) {
            container.innerHTML = '';
            container.classList.remove('fade-out');
            void container.offsetWidth;
            container.classList.add('fade-out');

            if (!data) return;

            const sw = data.screenWidth;
            const sh = data.screenHeight;
            const monitors = Array.isArray(data.monitors) && data.monitors.length > 0
                ? data.monitors
                : [{ x: 0, y: 0, width: sw, height: sh }];

            for (const monitor of monitors) {
                addZone(monitor.x, monitor.y, monitor.width, monitor.height, 'zone-monitor');
            }

            for (const monitor of monitors) {
                renderMonitorZones(monitor, data);
            }
        }

        function renderMonitorZones(monitor, data) {
            if (data.edgeStopEnabled) {
                const cTL = data.cornerStopEnabled ? data.cornerStopTL : 0;
                const cTR = data.cornerStopEnabled ? data.cornerStopTR : 0;
                const cBL = data.cornerStopEnabled ? data.cornerStopBL : 0;
                const cBR = data.cornerStopEnabled ? data.cornerStopBR : 0;

                addZone(
                    monitor.x + cTL,
                    monitor.y,
                    monitor.width - cTL - cTR,
                    data.edgeStopTop,
                    'zone-edge'
                );
                addZone(
                    monitor.x + cBL,
                    monitor.y + monitor.height - data.edgeStopBottom,
                    monitor.width - cBL - cBR,
                    data.edgeStopBottom,
                    'zone-edge'
                );
                addZone(
                    monitor.x,
                    monitor.y + cTL,
                    data.edgeStopLeft,
                    monitor.height - cTL - cBL,
                    'zone-edge'
                );
                addZone(
                    monitor.x + monitor.width - data.edgeStopRight,
                    monitor.y + cTR,
                    data.edgeStopRight,
                    monitor.height - cTR - cBR,
                    'zone-edge'
                );
            }

            if (data.cornerStopEnabled) {
                addZone(monitor.x, monitor.y, data.cornerStopTL, data.cornerStopTL, 'zone-corner');
                addZone(
                    monitor.x + monitor.width - data.cornerStopTR,
                    monitor.y,
                    data.cornerStopTR,
                    data.cornerStopTR,
                    'zone-corner'
                );
                addZone(
                    monitor.x,
                    monitor.y + monitor.height - data.cornerStopBL,
                    data.cornerStopBL,
                    data.cornerStopBL,
                    'zone-corner'
                );
                addZone(
                    monitor.x + monitor.width - data.cornerStopBR,
                    monitor.y + monitor.height - data.cornerStopBR,
                    data.cornerStopBR,
                    data.cornerStopBR,
                    'zone-corner'
                );
            }
        }

        function addZone(x, y, w, h, cls) {
            if (w <= 0 || h <= 0) return;
            const div = document.createElement('div');
            div.className = 'zone ' + cls;
            div.style.left = x + 'px';
            div.style.top = y + 'px';
            div.style.width = w + 'px';
            div.style.height = h + 'px';
            container.appendChild(div);
        }

        function handleOverlayClick(event) {
            if (!pickMode) return;
            event.preventDefault();
            event.stopPropagation();

            const x = event.clientX + overlayBounds.x;
            const y = event.clientY + overlayBounds.y;

            invokeTauri('sequence_point_picked', { x, y, isFinal: false });
        }

        function handleOverlayContextMenu(event) {
            if (!pickMode) return;
            event.preventDefault();
            event.stopPropagation();

            const x = event.clientX + overlayBounds.x;
            const y = event.clientY + overlayBounds.y;

            invokeTauri('sequence_point_picked', { x, y, isFinal: true });
            pickMode = false;
        }

        async function invokeTauri(cmd, args) {
            if (window.__TAURI__ && window.__TAURI__.core) {
                try {
                    await window.__TAURI__.core.invoke(cmd, args);
                } catch (e) {
                    console.error('[Overlay] invoke failed:', e);
                }
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', setupTauriListener);
        } else {
            setupTauriListener();
        }
    </script>
</body>
</html>
